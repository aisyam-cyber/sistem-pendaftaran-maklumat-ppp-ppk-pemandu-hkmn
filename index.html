<!-- VIEW 3: MODUL LAPORAN RASMI -->
<div id="viewLaporan" class="d-none">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-extrabold text-navy m-0">Penjanaan Laporan Rasmi</h3>
            <p class="text-muted small m-0">Pengeluaran & Cetakan Laporan Operasi Hospital Kemaman</p>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-primary" onclick="eksportKeCSV()"><i class="fa-solid fa-file-excel me-1"></i> Eksport Excel / CSV</button>
            <button class="btn btn-kkm-primary" onclick="cetakLaporan()"><i class="fa-solid fa-print me-1"></i> Cetak / Simpan PDF</button>
        </div>
    </div>

    <!-- CARDBOX PENAPIS LAPORAN (MENGANDUNGI BUTANG JANA LAPORAN) -->
    <div class="card card-custom p-3 mb-4 no-print">
        <div class="row g-3">
            <div class="col-md-3">
                <label class="form-label fw-semibold">Pilih Skim</label>
                <select id="laporanSkim" class="form-select">
                    <option value="">-- Semua Skim --</option>
                    <option value="PPP">PPP</option>
                    <option value="PPK">PPK</option>
                    <option value="PEMANDU">PEMANDU</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label fw-semibold">Pilih Status Rekod</label>
                <select id="laporanStatus" class="form-select">
                    <option value="ACTIVE" selected>ACTIVE (Aktif)</option>
                    <option value="TRANSFERRED">TRANSFERRED (Bertukar)</option>
                    <option value="RETIRED">RETIRED (Bersara)</option>
                    <option value="ARCHIVED">ARCHIVED (Diarkibkan)</option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label fw-semibold">Spesifik Unit</label>
                <input type="text" id="laporanUnit" class="form-control" placeholder="Tinggalkan kosong untuk semua unit">
            </div>
            <div class="col-md-2 d-grid align-items-end">
                <!-- BUTANG JANA LAPORAN (DIKEMASKINI KEPADA KKM PRIMARY) -->
                <button class="btn btn-kkm-primary fw-bold" onclick="janaDanPaparkanLaporan()">
                    <i class="fa-solid fa-filter me-1"></i> Jana Laporan
                </button>
            </div>
        </div>
    </div>

    <!-- BEKAS HASIL PRACETAK LAPORAN -->
    <div id="bekasJadualLaporan">
        <div class="text-center py-5 text-muted border rounded bg-white">
            Sila tekan butang <strong>"Jana Laporan"</strong> di atas untuk memaparkan pracetak.
        </div>
    </div>
</div>
